[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "hooks/list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "window"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::<Game<'_> as ApplicationHandler>::window_event"
helper = "hooks/window.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "event", ty = "&winit::event::WindowEvent", value = "&event" },
]

[[injection]]
id = "draw"
kind = "HEAD"
target = "horizon_client::game::debug_keys::Game<'_>::draw_debug_overlay"
helper = "hooks/draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "wear"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::entity_geometry"
helper = "hooks/wear.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut out" },
]

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "hooks/frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "worn"
kind = "HEAD"
target = "horizon_client::game::mob_blocks::Game<'_>::head_item_geometry"
helper = "hooks/worn.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mob", ty = "&horizon_client::mobs::Mob", value = "mob" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "light", ty = "u32", value = "light" },
  { name = "lit", ty = "bool", value = "lit" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

[[injection]]
id = "aura_lines"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::fishing::Game<'_>::fishing_line"
helper = "hooks/lines.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "size", ty = "[u32; 2]", value = "size" },
]

[[injection]]
id = "hide_armor"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::mobs::render::render_with"
helper = "hooks/armor.rs"
bindings = [
  { name = "m", ty = "&Mob", value = "m" },
  { name = "alpha", ty = "f32", value = "alpha" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "atlas", ty = "Atlas<'_>", value = "atlas" },
  { name = "light", ty = "u32", value = "light" },
  { name = "data", ty = "&MobData", value = "data" },
  { name = "extra", ty = "&[(&Part, [f32; 4], u32, u32, bool)]", value = "extra" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "out" },
]
