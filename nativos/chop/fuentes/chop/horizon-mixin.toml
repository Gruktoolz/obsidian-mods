[mod]
id = "chop"
version = "1.0.1"
priority = 100

# The Horizon commit it is built on: Nightly 2026-11-01 (tag nightly-source/2026-11-01-c9d474d).
# Besides the native hook points it uses some of the game's own state and functions (the level's
# blocks, the server's players and mobs, block loot, item spawning, the sound and particle queues),
# so it pins that commit.
[compatibility]

# The rules: the tree, the fall direction, the physics, the settings.
[[module]]
id = "core"
file = "crates/horizon-client/src/game.rs"
name = "chop_core"
source = "core.rs"

# The game's side: hooks, loot, displays, effects, damage, /chop.
[[module]]
id = "server"
file = "crates/horizon-client/src/game.rs"
name = "chop_server"
source = "server.rs"

[[injection]]
id = "destroy_block"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_destroy_block"
helper = "destroy.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
]

[[injection]]
id = "place_block"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_place_block"
helper = "place.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
]

[[injection]]
id = "level_tick_pre"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_pre"
helper = "level_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "server_tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_tick"
helper = "server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "crate::game::native_lifecycle::ServerTickPhase", value = "phase" },
]

[[injection]]
id = "register_commands"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_register_commands"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "&mut *commands" },
]

[[injection]]
id = "perform_command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_perform_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "server_stopping"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_stopping"
helper = "stopping.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "world_lifecycle"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_world_lifecycle"
helper = "lifecycle.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" },
]

[[injection]]
id = "left_click_block"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_left_click_block"
helper = "left_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
]

[[injection]]
id = "player_tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_tick"
helper = "player_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "right_click_block"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
]
