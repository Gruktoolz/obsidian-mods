[mod]
id = "projecte_core"
version = "0.1.0"
priority = 100

# ProjectE for Horizon (native half). The commit it was tested on: it uses only
# the native hook points and helpers (hooks in compatibility.json).
[compatibility]

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "pe_glue"
source = "pe_glue.rs"

[[module]]
id = "engine"
file = "crates/horizon-client/src/game.rs"
name = "pe_engine"
source = "pe_engine.rs"

[[injection]]
id = "component_types"
target = "horizon_client::game::native_hooks::Game<'_>::native_component_types"
kind = "HEAD"
helper = "component_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<String>", value = "&mut *types" },
]

[[injection]]
id = "block_entity"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "block_entity_ticks"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_ticks"
kind = "HEAD"
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

