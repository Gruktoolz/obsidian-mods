[mod]
id = "right_click_crops"
version = "1.0.1"
priority = 100

[compatibility]

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "right_click_crops"
source = "runtime.rs"

[[module]]
id = "crop-gameplay"
file = "crates/horizon-client/src/game.rs"
name = "right_click_crops_gameplay"
source = "gameplay.rs"

[[injection]]
id = "register-mod"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "register.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "mods" },
]

[[injection]]
id = "report-mod-start"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "startup.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

[[injection]]
id = "list-plant-settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings_list.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "buttons" },
]

[[injection]]
id = "toggle-plant-setting"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "settings_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "harvest-held-item"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item_on"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

[[injection]]
id = "stop-offhand-followup"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item"
helper = "use_item.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "claimed", ty = "&mut bool", value = "claimed" },
]

[[injection]]
id = "harvest-empty-hand"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "right_click_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "canceled" },
]
