# ayynoxs map pack: minimap + world map for Horizon.
[mod]
id = "ayynoxs_map_pack"
version = "0.4.2"
priority = 100

# The world map uses the Advancements screen's slot and the server address,
# which are not native hook points: the pack is pinned to the commit it was
# made on.
[compatibility]

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "ayynoxs_map"
source = "runtime.rs"

# --- Native hook points ------------------------------------------------

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "minimap"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_minimap"
helper = "minimap.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "minimap", ty = "&mut Option<crate::game::native_hooks::NativeMinimap>", value = "&mut *minimap" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

# --- The world map screen, in the Advancements screen's place ----------

[[injection]]
id = "map-draw"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::advancements_screen::Game<'_>::draw_advancements"
helper = "map_draw.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "map-mouse"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::advancements_screen::Game<'_>::advancements_mouse"
helper = "map_mouse.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "map-drag"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::advancements_screen::Game<'_>::advancements_drag"
helper = "map_drag.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "map-scroll"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::advancements_screen::Game<'_>::advancements_scroll"
helper = "map_scroll.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "y", ty = "f32", value = "y" },
]

[[injection]]
id = "map-close"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::advancements_screen::Game<'_>::close_advancements"
helper = "map_close.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# --- A server's address, for its own map folder ------------------------

[[injection]]
id = "connecting"
kind = "HEAD"
target = "horizon_client::game::extras::Game<'_>::extras_connecting"
helper = "connecting.rs"
bindings = [
  { name = "address", ty = "&str", value = "address" },
]

# --- The name window: its characters and keys --------------------------

[[injection]]
id = "dialog-char"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_char_typed_pre"
helper = "dialog_char.rs"
bindings = [
  { name = "c", ty = "char", value = "c" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "dialog-key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_key_pressed_pre"
helper = "dialog_key.rs"
bindings = [
  { name = "key", ty = "&str", value = "key" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# --- Sharing: mod messages, and the relay a Horizon host runs ----------

[[injection]]
id = "net-from-server"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_net_from_server"
helper = "net_from_server.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "net-from-client"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_net_from_client"
helper = "net_from_client.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "player-in"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_logged_in"
helper = "player_in.rs"
bindings = [{ name = "player", ty = "u128", value = "player" }]

[[injection]]
id = "player-out"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_logged_out"
helper = "player_out.rs"
bindings = [{ name = "player", ty = "u128", value = "player" }]

[[injection]]
id = "relay-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "relay_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# --- Waypoints through private chat messages, on any server -------------

[[module]]
id = "chat-inbox"
file = "crates/horizon-client-render/src/lib.rs"
name = "ayynoxs_chat"
source = "chat_inbox.rs"
visibility = "pub"

[[injection]]
id = "chat-add"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::chat::Chat::add"
helper = "chat_add.rs"
bindings = [{ name = "content", ty = "&crate::text::Text", value = "&content" }]

[[injection]]
id = "chat-add-signed"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::chat::Chat::add_signed"
helper = "chat_add_signed.rs"
bindings = [{ name = "content", ty = "&crate::text::Text", value = "&content" }]
