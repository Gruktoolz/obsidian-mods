[mod]
id = "big_nukes_native"
version = "0.1.3"
priority = 100

# The Horizon source this bundle is planned and built on: Nightly 2026-11-07
# (`nightly-source/2026-11-07-6560641`). It needs API 126 (`native_edit_blocks`).
[compatibility]

# The rules: no game type, also the mod's Cargo library (its tests).
[[module]]
id = "rules"
file = "crates/horizon-client/src/game.rs"
name = "big_nukes"
source = "runtime.rs"

# The renderer's share: the clouds and the rings, over the finished world.
[[module]]
id = "sky"
file = "crates/horizon-client-render/src/gfx/native_render.rs"
name = "big_nukes_sky"
source = "sky.rs"
# The window's glue, in another crate, fills its list.
visibility = "pub"

# Everything that names the game's types.
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "big_nukes_glue"
source = "glue.rs"

# The silo and the bomber (plan 7): their glue, beside the rest.
[[module]]
id = "silo"
file = "crates/horizon-client/src/game.rs"
name = "big_nukes_silo"
source = "silo.rs"

# Iodine and the decontaminator (plan 9): their glue, beside the rest.
[[module]]
id = "decon"
file = "crates/horizon-client/src/game.rs"
name = "big_nukes_decon"
source = "decon.rs"

# The bunker (plan 10): its glue, beside the rest.
[[module]]
id = "bunker"
file = "crates/horizon-client/src/game.rs"
name = "big_nukes_bunker"
source = "bunker.rs"

# The machines and the bombs, declared in code; the ores and the ash are the assets half's files.
# The content mod (textures, models, sounds, text, recipes) rides inside this bundle, so the mod is one file:
# the game's list of content mods gets it as a dev mod (written once to .horizon-cache).
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

[[injection]]
id = "blocks"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_blocks"
helper = "blocks.rs"
bindings = [
  { name = "blocks", ty = "&mut Vec<horizon_mods::content::Block>", value = "&mut *blocks" },
]

[[injection]]
