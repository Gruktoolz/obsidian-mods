[mod]
id = "deepbore_quarry_native"
version = "0.1.2"
priority = 100

# The Horizon source this bundle is planned and built on: Nightly 2026-11-04.
# It needs API 309 (`native_menu_quick_move`).
[compatibility]

# The rules: no game type, also the mod's Cargo library (its tests).
[[module]]
id = "rules"
file = "crates/horizon-client/src/game.rs"
name = "deepbore_quarry"
source = "runtime.rs"

# Everything that names the game's types.
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "deepbore_quarry_glue"
source = "glue.rs"

# The content mod (textures, models, text, recipes) rides inside this bundle, so the mod is one file:
# the game's list of content mods gets it as a dev mod (written once to .horizon-cache).
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# What each slot of the screen takes: on the library's side of the game, so it
# can't reach the glue.
[[injection]]
id = "slot-rules"
kind = "HEAD"
target = "horizon_client_lib::menu::native_menu_slot_rules"
helper = "slot_rules.rs"
bindings = [
  { name = "menu", ty = "&str", value = "menu" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "may_place", ty = "&mut bool", value = "&mut *may_place" },
  { name = "max_stack", ty = "&mut u32", value = "&mut *max_stack" },
]

[[injection]]
id = "blocks"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_blocks"
helper = "blocks.rs"
bindings = [
  { name = "blocks", ty = "&mut Vec<horizon_mods::content::Block>", value = "&mut *blocks" },
]

[[injection]]
id = "items"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_items"
helper = "items.rs"
