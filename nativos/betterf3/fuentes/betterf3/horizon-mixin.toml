[mod]
id = "betterf3"
version = "1.0.0"
priority = 100

# Built for this Nightly: besides the hook points it replaces the game's own
# debug overlay (`draw_debug_overlay`), reads the data its F3 entries read
# and takes two keys in `handleDebugKeys`.
[compatibility]

# The settings and modules, BetterF3's texts.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "betterf3"
source = "runtime.rs"

# The modules' lines, read from the game.
[[module]]
id = "lines"
file = "crates/horizon-client/src/game.rs"
name = "betterf3_lines"
source = "lines.rs"

# The debug screen drawn BetterF3's way, its animation, the hidden layers.
[[module]]
id = "overlay"
file = "crates/horizon-client/src/game.rs"
name = "betterf3_overlay"
source = "overlay.rs"

# ModConfigScreen, ModulesScreen and the Cloth Config screens, F3+M and F3+F.
[[module]]
id = "screens"
file = "crates/horizon-client/src/game.rs"
name = "betterf3_screens"
source = "screens.rs"

# Cloth Config's screen (cloth.rs) with Cloth Config's error icon
# (cloth_sprites.rs).
[[module]]
id = "cloth"
file = "crates/horizon-client/src/game.rs"
name = "betterf3_cloth"
source = "cloth.rs"

[[module]]
id = "cloth_sprites"
file = "crates/horizon-client/src/game.rs"
name = "betterf3_cloth_sprites"
source = "cloth_sprites.rs"

# F3+M and F3+F, beside `handleDebugKeys` in the client library (which can't
# reach the game's modules).
[[module]]
id = "keys"
file = "crates/horizon-client/src/debug_keys.rs"
name = "betterf3_keys"
source = "keys.rs"
visibility = "pub"

[[injection]]
id = "debug_keys"
target = "horizon_client_lib::debug_keys::DebugKeys::handle_debug_keys"
kind = "HEAD"
cancellable = true
helper = "h_debug_keys.rs"
bindings = [
  { name = "key", ty = "&str", value = "key" },
]

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "h_frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The game's F3 text gives way to BetterF3's while it shows.
[[injection]]
id = "debug_overlay"
target = "horizon_client::game::debug_keys::Game<'_>::draw_debug_overlay"
kind = "HEAD"
cancellable = true
helper = "h_overlay.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "size", ty = "[u32; 2]", value = "size" },
]

[[injection]]
id = "layer"
hook = "gui_layer_pre"
hook_version = 1
kind = "HEAD"
helper = "h_layer.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "layer", ty = "&str", value = "layer" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "h_list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "h_settings.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "h_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "render"
hook = "screen_render_post"
hook_version = 1
kind = "HEAD"
helper = "h_render.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
]

# The options stay hidden under BetterF3's screens.
[[injection]]
id = "options_cover"
target = "horizon_client::game::options::Game<'_>::draw_options"
kind = "HEAD"
cancellable = true
helper = "h_options_cover.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

[[injection]]
id = "press"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "h_press.rs"
bindings = [
