[mod]
id = "clientsort"
version = "1.2.0"
priority = 100

# Built for this Nightly: besides the hook points it uses the game's own
# inventory code (slot layout, the menu engine's predicted clicks, where the
# inventory screen draws its sort buttons).
[compatibility]

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "clientsort"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "clientsort_glue"
source = "glue.rs"

# ClientSort's config screen: Cloth Config's screen (cloth.rs, drawn with
# Cloth Config's texture, cloth_sprites.rs) with ClientSort's options
# (config.rs).
[[module]]
id = "cloth"
file = "crates/horizon-client/src/game.rs"
name = "clientsort_cloth"
source = "cloth.rs"

[[module]]
id = "cloth_sprites"
file = "crates/horizon-client/src/game.rs"
name = "clientsort_cloth_sprites"
source = "cloth_sprites.rs"

[[module]]
id = "config"
file = "crates/horizon-client/src/game.rs"
name = "clientsort_config"
source = "config.rs"

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

[[injection]]
id = "key"
hook = "key"
hook_version = 1
kind = "HEAD"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "mouse"
hook = "mouse_button_pre"
hook_version = 1
kind = "HEAD"
helper = "mouse.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "button", ty = "i32", value = "button" },
  { name = "pressed", ty = "bool", value = "pressed" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "render"
hook = "screen_render_post"
hook_version = 1
kind = "HEAD"
helper = "render.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
]

# ClientSort's buttons are drawn where the inventory screen draws Horizon's
# own sort buttons: under the held stack and the item tooltips.
[[injection]]
id = "draw"
target = "horizon_client::game::tweaks::Game<'_>::draw_sort_buttons"
kind = "HEAD"
helper = "draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

# Horizon's own sort buttons ("≡" by the titles) give way to ClientSort's.
[[injection]]
id = "hide"
target = "horizon_client::game::tweaks::Game<'_>::sort_buttons"
kind = "HEAD"
cancellable = true
helper = "hide.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

# The options stay hidden under ClientSort's config screen.
[[injection]]
id = "options_cover"
target = "horizon_client::game::options::Game<'_>::draw_options"
kind = "HEAD"
cancellable = true
helper = "h_options_cover.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

# The config screen's mouse and keys, over the options.
[[injection]]
id = "press"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "h_press.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "release"
hook = "screen_mouse_button_released_pre"
hook_version = 1
kind = "HEAD"
helper = "h_release.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "drag"
hook = "screen_mouse_dragged_pre"
hook_version = 1
kind = "HEAD"
helper = "h_drag.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "scroll"
hook = "screen_mouse_scrolled_pre"
hook_version = 1
kind = "HEAD"
helper = "h_scroll.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "key_pressed"
hook = "screen_key_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "h_key_pressed.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "key", ty = "&str", value = "key" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "key_released"
hook = "screen_key_released_pre"
hook_version = 1
kind = "HEAD"
helper = "h_key_released.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "char"
hook = "screen_char_typed_pre"
hook_version = 1
kind = "HEAD"
helper = "h_char.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "c", ty = "char", value = "c" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]
