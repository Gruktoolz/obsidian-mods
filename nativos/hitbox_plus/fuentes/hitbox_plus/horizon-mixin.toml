[mod]
id = "hitbox_plus"
version = "1.3.0"
priority = 100

[compatibility]

[[module]]
id = "runtime"
file = "crates/horizon-client/src/lib.rs"
name = "official_hitbox_plus"
source = "runtime.rs"
visibility = "pub"

[[injection]]
id = "box"
kind = "HEAD"
cancellable = true
target = "horizon_client::gizmos::Gizmos::entity_box"
helper = "box.rs"
bindings = [
  { name = "gizmos", ty = "&mut crate::gizmos::Gizmos", value = "&mut *self" },
  { name = "min", ty = "[f64; 3]", value = "min" },
  { name = "max", ty = "[f64; 3]", value = "max" },
  { name = "position", ty = "[f64; 3]", value = "position" },
  { name = "eye_height", ty = "f32", value = "eye_height" },
  { name = "living", ty = "bool", value = "living" },
  { name = "view", ty = "(f32, f32)", value = "view" },
]

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut Corners", value = "&mut *corners" },
]
